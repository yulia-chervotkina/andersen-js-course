<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <nav>
            <button class="nav-button" id="recipe">RECIPE</button>
            <button class="nav-button" id="add-new-recipe">ADD NEW RECIPE</button>
            <button class="nav-button" id="favorites">FAVORITES</button>
    </nav>

    <main>

        <div id="form-container">
            <h2>New Recipe</h2>
            <form action="" method="post" id="form">
                <div>
                    <label for="name">Name</label>
                    <input id="user-input-name" type="text" placeholder="What would you like to cook?" required>
                </div>

                <div>
                    <label for="ingredients">Ingredients</label>
                    <textarea id="user-input-ingredients" type="text" placeholder="What ingredients will you use?" rows="5" required></textarea>
                </div>

                <div>
                    <label for="instructions">Instructions</label>
                    <textarea id="user-input-instructions" type="text" placeholder="Any instructions?" rows="5" required></textarea>
                </div>

                <div id="form-buttons">
                    <button id="submit" type="submit">Submit</button>
                    <button id="cancel" type="button">Cancel</button>
                </div>
            </form> 
        </div>


        <div class="recipe-cards-container">
            <article class="recipe-card">
            <div class="recipe-name">Lasagna</div>
            <div class="recipe-ingredients">
                <div class="recipe-cart-label">Ingredients:</div>
                <p class="recipe-text">Meat, pasta, prosciutto</p>
            </div>
            <div class="recipe-instruction">
                <div class="recipe-cart-label">Instructions:</div>
                <p class="recipe-text">Heat up a skillet</p>
            </div>
            <hr>
            <div class="recipe-card-footer">
                <button class="icon"><img id="favorite" src="./assets/favorite.svg" alt="favorite button"></button>
                <button class="icon" id="edit"><img src="./assets/edit.svg" alt="edit button"></button>
                <button class="icon" id="close"><img src="./assets/close.svg" alt="close button"></button>  
            </div>
        </article>
        </div>
    </main>

</body>
</html>
